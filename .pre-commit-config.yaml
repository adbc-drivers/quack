repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: 38bfb07c0c64c304f47eb52090f8288150c77730  # frozen: v0.17.1
  hooks:
  - id: ruff-check
    name: "ruff check"
    args: ["--extend-select", "I", "--fix"]
  - id: ruff-format

- repo: https://github.com/codespell-project/codespell
  rev: 57b21406f092110c18776e39b0bda50d37c945c8  # frozen: v2.4.3
  hooks:
  - id: codespell
    exclude: >
        (?x)^(
            .*Cargo\.toml|
            third_party/arrow-adbc/LICENSE\.txt
        )$

- repo: https://github.com/pre-commit/mirrors-clang-format
  rev: 98ad4ddb9c057de2f5b9e93e44e6db959807d68c  # frozen: v23.1.3
  hooks:
  - id: clang-format
    types_or: [c, c++]

- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
  hooks:
  - id: check-added-large-files
    args: ["--enforce-all"]
  - id: check-case-conflict
  - id: check-executables-have-shebangs
  - id: check-yaml
  - id: detect-private-key
  - id: end-of-file-fixer
    exclude: '\.sln$'
  - id: mixed-line-ending
    args: [--fix=lf]
    exclude: '\.(bat|sln)$'
  - id: trailing-whitespace
    exclude: '\.patch$'

- repo: https://github.com/pre-commit/mirrors-clang-format
  rev: 98ad4ddb9c057de2f5b9e93e44e6db959807d68c  # frozen: v23.1.3
  hooks:
    - id: clang-format
      types_or: [c, c++]

- repo: https://github.com/cheshirekow/cmake-format-precommit
  rev: e2c2116d86a80e72e7146a06e68b7c228afc6319  # v0.6.13
  hooks:
  - id: cmake-format
    args: [--in-place]

- repo: https://github.com/adbc-drivers/dev
  rev: 50a208814d023facebce91d38212860a2d634ad3
  hooks:
  - id: rat
