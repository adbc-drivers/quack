services:
  quack-server:
    image: duckdb/duckdb:1.5.3
    command:
      - duckdb
      - /data/quack-validation.duckdb
      - -init
      - /init/init.sql
    ports:
      - "9494:9494"
    stdin_open: true
    tty: true
    volumes:
      - quack-data:/data
      - ./ci/docker/quack-server:/init:ro

  test-service:
    image: curlimages/curl:8.16.0
    entrypoint:
      - /bin/sh
      - -c
    command:
      - sleep infinity
    depends_on:
      quack-server:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - curl
        - -sS
        - -o
        - /dev/null
        - http://quack-server:9494/quack
      interval: 2s
      timeout: 30s
      retries: 30
      start_period: 10s

volumes:
  quack-data:
