services:
  quack-server:
    image: duckdb/duckdb:1.5.5
    command:
      - duckdb
      - /data/quack-validation.duckdb
      - -init
      - /init/init.sql
    stdin_open: true
    tty: true
    volumes:
      - quack-data:/data
      - ./ci/docker/quack-server:/init:ro

  test-service:
    image: caddy:2.10.2-alpine
    ports:
      - "9494:9494"
      - "9496:9496"
    volumes:
      - ./ci/docker/quack-proxy/Caddyfile:/etc/caddy/Caddyfile:ro
    tmpfs:
      - /data
      - /config
    depends_on:
      quack-server:
        condition: service_started
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          nc -z -w 2 quack-server 9494 &&
          wget -q -O /dev/null http://127.0.0.1:9494/health &&
          wget --no-check-certificate -q -O /dev/null https://127.0.0.1:9496/health
      interval: 2s
      timeout: 30s
      retries: 30
      start_period: 10s

volumes:
  quack-data:
